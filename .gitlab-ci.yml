workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

stages:
  - build
  - docker

build_node:
    stage: build
    image: node:24.0.0-slim
    script:
        - su node -c "npm i && npm run build"
    artifacts:
      paths:
        - "dist/"

# Base Kaniko build template (no Maven dependency)
.docker-build-template:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 -w 0)\"}}}" > /kaniko/.docker/config.json

docker-build-n8n-enreach:
  extends: .docker-build-template
  needs:
    - build_node
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $CI_REGISTRY_IMAGE/n8n-enreach:$CI_COMMIT_SHORT_SHA
      --destination $CI_REGISTRY_IMAGE/n8n-enreach:latest